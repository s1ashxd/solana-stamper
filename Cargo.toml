[package]
name = "tx-stamper"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "V0 Solana transaction templates with byte-level re-stamping."

[dependencies]
solana-sdk = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
solana-compute-budget-interface = "3"
bincode = "1.3"
thiserror = "2"
smallvec = "1"
arc-swap = "1"
ed25519-dalek = { version = "2", features = ["hazmat", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
sha2 = { version = "0.10", features = ["asm"] }
base64-simd = "0.8"
bs58 = "0.5"
spl-associated-token-account = { version = "8", optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
pumpfun = ["dep:spl-associated-token-account"]
pumpswap = ["dep:spl-associated-token-account"]
damm-v2 = ["dep:spl-associated-token-account"]
printr = ["dep:spl-associated-token-account"]
all-protocols = ["pumpfun", "pumpswap", "damm-v2", "printr"]

[[bench]]
name = "stamp"
harness = false

[[bench]]
name = "envelope"
harness = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
semicolon_if_nothing_returned = "allow"
